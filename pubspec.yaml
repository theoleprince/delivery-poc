name: poc_uber
description: >
  POC Flutter/Firebase d'une plateforme de livraison temps réel
  (type Uber/Yango/Glovo) — Clean Architecture, Riverpod, GoRouter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.1

  # Maps & Localisation
  # Mapbox plutôt que Google Maps Flutter : voir CLAUDE.md § AMENDEMENTS
  # (2026-07-03) — évite la facturation Google Cloud obligatoire pour un POC.
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Modèles
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # i18n / formatage
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génération de code
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

  # Tests
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
